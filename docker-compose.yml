name: grafana-lab

services:
  loki:
    image: ${IMAGE_REGISTRY:-docker.io}/grafana/loki:${LOKI_TAG:-3.5.7}
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 460MiB
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  prometheus:
    image: ${IMAGE_REGISTRY:-docker.io}/prom/prometheus:${PROMETHEUS_TAG:-v3.7.3}
    mem_limit: 384m
    environment:
      GOMEMLIMIT: 345MiB
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  alloy:
    image: ${IMAGE_REGISTRY:-docker.io}/grafana/alloy:${ALLOY_TAG:-v1.11.3}
    mem_limit: 320m
    environment:
      GOMEMLIMIT: 288MiB
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - lab-logs:/var/log/lab:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  inventory:
    build:
      context: services
      target: inventory
      args: &build-args
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io}
        GO_TAG: ${GO_TAG:-1.24.9-alpine}
    image: grafana-lab/inventory:dev
    mem_limit: 96m
    environment:
      GOMEMLIMIT: 86MiB
      SERVICE_TOKEN: ${SERVICE_TOKEN:-7f3c9a1e5b2d4f60}
      INCIDENT_DURATION: ${INCIDENT_DURATION:-3m}
    volumes:
      - lab-logs:/var/log/lab
      - lab-state:/var/lib/lab
    healthcheck:
      test: ["CMD", "/inventory", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  orders:
    build:
      context: services
      target: orders
      args: *build-args
    image: grafana-lab/orders:dev
    mem_limit: 96m
    environment:
      GOMEMLIMIT: 86MiB
      SERVICE_TOKEN: ${SERVICE_TOKEN:-7f3c9a1e5b2d4f60}
      INVENTORY_URL: http://inventory:8080
      INCIDENT_DURATION: ${INCIDENT_DURATION:-3m}
    volumes:
      - lab-logs:/var/log/lab
      - lab-state:/var/lib/lab
    depends_on:
      inventory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/orders", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  loadgen:
    build:
      context: services
      target: loadgen
      args: *build-args
    image: grafana-lab/loadgen:dev
    mem_limit: 64m
    environment:
      GOMEMLIMIT: 57MiB
      TARGET_URL: http://orders:8080
    volumes:
      - lab-logs:/var/log/lab
    depends_on:
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/loadgen", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  grafana:
    image: ${IMAGE_REGISTRY:-docker.io}/grafana/grafana:${GRAFANA_TAG:-12.2.1}
    mem_limit: 512m
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    environment:
      GOMEMLIMIT: 460MiB
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/lab-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  lab-logs:
  lab-state:
  loki-data:
  alloy-data:
  prometheus-data:
  grafana-data:
