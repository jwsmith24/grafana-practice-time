name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: the default 3m auto-clear and long-running checks.
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Short incidents keep PR runs fast; the nightly run uses the 3m default.
      INCIDENT_DURATION: ${{ github.event_name == 'schedule' && '3m' || '15s' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache: false

      - name: Service unit tests
        working-directory: services
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Static checks
        working-directory: tests
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go vet -tags integration ./...
          go test ./...

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 detect --source /repo --no-banner --redact

      - name: Script checks
        run: |
          sudo apt-get install -y -q bats shellcheck >/dev/null
          shellcheck incident.sh check.sh unlock.sh hint.sh
          docker run --rm -v "$PWD:/w:ro" -w /w bash:3.2.57 bash -n check.sh incident.sh unlock.sh hint.sh
          bats tests/scripts

      - name: Validate compose
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait

      - name: Integration tests
        working-directory: tests
        run: go test -tags integration -count=1 -timeout 25m -v ./integration/...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: E2E tests
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

      - name: Compose logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  # Tests that start, stop, reset or break the stack themselves, using the
  # attendee compose file alone. They run beside the main job.
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIFECYCLE_OFFLINE: "1"
      LAB_SOAK: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache: false

      - name: Build service images
        run: docker compose build

      - name: Lifecycle tests
        working-directory: tests
        run: go test -tags lifecycle -count=1 -timeout 55m -v ./lifecycle/...

      - name: Compose logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v
