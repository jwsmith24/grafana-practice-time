name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache: false

      - name: Service unit tests
        working-directory: services
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Static checks
        working-directory: tests
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go vet -tags integration ./...
          go test ./...

      - name: Validate compose
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml config --quiet

      - name: Start stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait

      - name: Integration tests
        working-directory: tests
        run: go test -tags integration -count=1 -v ./integration/...

      - name: Compose logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
